global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rag-api
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: rag-worker
    static_configs:
      - targets: [host.docker.internal:9465]
  - job_name: rag-dispatcher
    static_configs:
      - targets: [host.docker.internal:9466]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: [qdrant:6333]
