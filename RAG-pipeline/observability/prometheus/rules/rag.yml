groups:
  - name: rag-recording
    interval: 30s
    rules:
      - record: rag:query_request_rate5m
        expr: sum(rate(rag_query_requests_total[5m]))
      - record: rag:query_error_ratio5m
        expr: sum(rate(rag_query_errors_total[5m])) / clamp_min(sum(rate(rag_query_requests_total[5m])), 0.000001)
      - record: rag:query_latency_p50_seconds
        expr: histogram_quantile(0.50, sum by (le) (rate(rag_query_duration_seconds_bucket[5m])))
      - record: rag:query_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_query_duration_seconds_bucket[5m])))
      - record: rag:query_latency_p99_seconds
        expr: histogram_quantile(0.99, sum by (le) (rate(rag_query_duration_seconds_bucket[5m])))
      - record: rag:retrieval_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le, retriever) (rate(rag_retrieval_duration_seconds_bucket[5m])))
      - record: rag:cache_hit_ratio5m
        expr: sum(rate(rag_cache_requests_total{result="hit"}[5m])) / clamp_min(sum(rate(rag_cache_requests_total[5m])), 0.000001)
      - record: rag:ingestion_throughput5m
        expr: sum(rate(rag_ingestion_tasks_total{status="ready"}[5m]))
      - record: rag:ingestion_failure_rate5m
        expr: sum(rate(rag_ingestion_failures_total[5m]))
      - record: rag:publication_failure_ratio5m
        expr: sum(rate(rag_publication_attempts_total{outcome="failure"}[5m])) / clamp_min(sum(rate(rag_publication_attempts_total[5m])), 0.000001)
      - record: rag:candidate_discard_ratio5m
        expr: sum(rate(rag_candidate_discarded_total[5m])) / clamp_min(sum(rate(rag_retrieval_candidates_count[5m])), 0.000001)
