x-app-environment: &app-environment
  RAG_PROFILE: local
  AUTH_ENABLED: "false"
  INGESTION_QUEUE_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  CONTROL_DATABASE_URL: postgresql+psycopg://rag:rag-local-only@postgres:5432/rag_control
  QDRANT_URL: http://qdrant:6333
  SPARSE_DB_PATH: /app/data/sparse_index.db
  UPLOAD_PATH: /app/data/uploads
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OBSERVABILITY_ENABLED: "true"
  EMBEDDED_OUTBOX_DISPATCHER: "false"
  QUERY_MAX_CONCURRENCY: "8"
  QUERY_EXECUTOR_PENDING: "8"
  POSTGRES_POOL_MAX: "12"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_control
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_control"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
  migrate:
    build: .
    profiles: [application]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    profiles: [application]
    command: ["python", "-m", "uvicorn", "src.api.app:create_api", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag-application-data:/app/data
      - model-cache:/root/.cache
    mem_limit: ${RAG_API_MEMORY_LIMIT:-2g}
    cpus: ${RAG_API_CPU_LIMIT:-2.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 40
      start_period: 180s
  worker:
    build: .
    profiles: [application]
    command: ["python", "-m", "src.worker"]
    environment:
      <<: *app-environment
      INGESTION_WORKER_ID: worker-container-1
      WORKER_METRICS_PORT: "9465"
    ports:
      - "127.0.0.1:9465:9465"
    volumes:
      - rag-application-data:/app/data
      - model-cache:/root/.cache
    mem_limit: ${RAG_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${RAG_WORKER_CPU_LIMIT:-2.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9465/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 40
      start_period: 180s
  dispatcher:
    build: .
    profiles: [application]
    command: ["python", "-m", "src.dispatcher"]
    environment: *app-environment
    ports:
      - "127.0.0.1:9466:9466"
    mem_limit: ${RAG_DISPATCHER_MEMORY_LIMIT:-384m}
    cpus: ${RAG_DISPATCHER_CPU_LIMIT:-0.5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9466/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
  tempo:
    image: grafana/tempo:2.7.2
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      tempo:
        condition: service_healthy
  alloy:
    image: grafana/alloy:v1.7.4
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - //var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_healthy
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://rag:rag-local-only@postgres:5432/rag_control?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    profiles: [observability]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - cadvisor
      - postgres-exporter
      - redis-exporter
  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: rag-local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  rag-application-data:
  model-cache:
